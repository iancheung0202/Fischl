name: Ruff

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Ruff fixes
        uses: astral-sh/ruff-action@v3
        with:
          args: check . --fix

      - name: Format with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: format .

      - name: Commit Ruff fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No Ruff fixes needed."
          else
            git add .
            git commit -m "style: auto-fix with Ruff"
            git push
          fi

      - name: Strict lint check
        uses: astral-sh/ruff-action@v3
        with:
          args: check .

      - name: Strict format check
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check .